services:
  db:
    image: postgres:16-alpine
    container_name: paypilot-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: paypilot
      POSTGRES_PASSWORD: paypilot
      POSTGRES_DB: paypilot_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paypilot -d paypilot_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    driver: local
